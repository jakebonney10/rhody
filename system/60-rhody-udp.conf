# Rhody: UDP socket buffers for ROS 2 / Fast DDS.
# Fast DDS sizes its sockets from the kernel default (rmem_default) unless an
# XML profile overrides it, and the kernel caps any setsockopt at rmem_max.
# The stock 212992 (208 KB) overflowed on the recorder's data socket: 2.4 MB
# point clouds and 2 MB sonar images arrive as ~40 back-to-back 64 KB datagrams
# over loopback. Measured 2026-10-12: Udp RcvbufErrors == InErrors (4.2M since
# boot), 28k drops/60 s on a recorder socket.
net.core.rmem_max = 67108864
net.core.rmem_default = 16777216
net.core.wmem_max = 67108864
net.core.wmem_default = 16777216

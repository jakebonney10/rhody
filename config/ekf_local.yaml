        # imu1_queue_size: 10
        # imu1_relative: false
        # imu1_differential: false
        # imu1_rejection_threshold: 5.0

        # Twist0: DVL velocity x/y/z -- from nortek dvl
        twist0: sensors/nortek_dvl/velocity
        twist0_config: [false, false, false,
                        false, false, false,
                        true,  true,  true,
                        false, false, false,
                        false, false, false]
        twist0_queue_size: 10
        twist0_rejection_threshold: 5.0

        # Pose0: Depth (Z only) -- from nortek dvl
        pose0: sensors/nortek_dvl/depth
        pose0_config: [false, false, true,
                    false, false, false,
                    false, false, false,
                    false, false, false,
                    false, false, false]
        pose0_queue_size: 10
        pose0_relative: false
        pose0_differential: false
        pose0_rejection_threshold: 5.0

        # [ADVANCED] The process noise covariance matrix can be difficult to tune, and can vary for each application, so it is

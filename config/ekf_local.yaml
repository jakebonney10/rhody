### ekf local config file ###
/**:
    ros__parameters:
        frequency: 10.0
        sensor_timeout: 2.0
        two_d_mode: false
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: true
        debug_out_file: /tmp/ekf_local_debug.txt
        publish_tf: true
        use_sim_time: true
        reset_on_time_jump: true
        smooth_lagged_data: true
        history_length: 5.0

        map_frame: map  
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom  

        # IMU0: DVL/IMU with full orientation (roll, pitch, yaw) -- from nortek dvl
        imu0: sensors/nortek_dvl/imu_ahrs
        imu0_config: [false, false, false,
                    true,  true,  true,
                    false, false, false,
                    false, false, false,
                    false, false, false]
        imu0_remove_gravitational_acceleration: false
        imu0_queue_size: 10
        imu0_relative: false
        imu0_differential: false
        imu0_rejection_threshold: 5.0

        # IMU1: angular velocity + linear acceleration -- from nortek dvl
        # imu1: sensors/nortek_dvl/imu
        # imu1_config: [false, false, false,
        #             false, false, false,
        #             false, false, false,
        #             true,  true,  true,
        #             true,  true,  true]

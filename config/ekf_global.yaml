### ekf config file ###
/**:
    ekf_global:
        ros__parameters:
            frequency: 30.0
            two_d_mode: false
            publish_acceleration: true
            publish_tf: true
            #debug: true
            #debug_out_file: /tmp/ekf_local_debug.txt

            # 1. Set the map_frame, odom_frame, and base_link frames to the appropriate frame names for your system.
            #     1a. If your system does not have a map_frame, just remove it, and make sure "world_frame" is set to the value of odom_frame.
            # 2. If you are fusing continuous position data such as wheel encoder odometry, visual odometry, or IMU data, set "world_frame"
            #    to your odom_frame value. This is the default behavior for robot_localization's state estimation nodes.
            # 3. If you are fusing global absolute position data that is subject to discrete jumps (e.g., GPS or position updates from landmark
            #    observations) then:
            #     3a. Set your "world_frame" to your map_frame value
            #     3b. MAKE SURE something else is generating the odom->base_link transform. Note that this can even be another state estimation node
            map_frame: map
            odom_frame: utm_local
            base_link_frame: base_link
            world_frame: utm_local

            # imu0: demo/imu
            # imu0_config: [false, false, false,
            #               false, false, false,
            #               false, false, false,
            #               false, false, true,
            #               false, false, false]

            # IMU0: angular velocity + linear acceleration -- from nortek dvl
            imu0: sensors/nortek_dvl/imu
            imu0_config: [false, false, false,
                        false, false, false,
                        false, false, false,
                        true, true, true,
                        false, false, false] 
            #imu0_remove_gravitational_acceleration: true

            # IMU1: DVL/IMU with full orientation (roll, pitch, yaw) -- from nortek dvl
            imu1: sensors/nortek_dvl/imu_ahrs
            imu1_config: [false, false, false,
                        true,  true,  true,
                        false, false, false,
                        false, false, false,
                        false, false, false]

            # Twist0: DVL velocity x/y/z -- from nortek dvl
            twist0: sensors/nortek_dvl/velocity
            twist0_config: [false, false, false,
                            false, false, false,
                            true,  true,  true,
                            false, false, false,
                            false, false, false]

            # # Pose0: Depth (Z only) -- from nortek dvl
            pose0: sensors/nortek_dvl/depth
            pose0_config: [false, false, true,
                        false, false, false,
                        false, false, false,
                        false, false, false,
                        false, false, false]

            #Pose1: USBL global position (X/Y UTM) from gps2map -- from subsonus usbl
            pose1: /utm/rhody/nav/sensors/subsonus_usbl/fix
            pose1_config: [true, true, false,
                        false, false, false,
                        false, false, false,
                        false, false, false,
                        false, false, false]
            pose1_rejection_threshold: 5.0




# changes made within this file require a rebuild for changes to take effect.
# colcon build --packages-select rhody
/**:
  ros__parameters:

    # Path to place logfiles generated by this driver.
    log_path: "~/.ros/log/"

    # What method will be used to connect to the device.
    # 0: Serial, 1/2: TCP Client/Server, 3: UDP, 4: CAN (N/A)
    comm_select: 1

    # Whether the driver pushes packet timer/period configuration to the device
    # at startup.
    #   true  (default): the driver requests the packets in 'packet_request'.
    #                    Requires a BIDIRECTIONAL port (e.g. 16718, set below).
    #   false (read-only mode): consume the stream exactly as the device emits
    #                    it, sending nothing. Use this with the read-only
    #                    "This Device" stream on port 16719 (which resets the
    #                    connection if written to). In that case the device must
    #                    already be outputting 020 + 028 at the desired rate.
    configure_device: true

    ################ Serial Communication Parameters
    # Supported Baud Rates: 2.4K, 4.8K, 9.6K, 19.2K, 38.4K, 57.6K.
    # 115.2K, 230.4K, 460.8K, 500K, 576K, 921.6K, 1M, 2M
    baud_rate: 115200
    com_port: ""

    ################ IP Communication Parameters
    # IP of the Advanced Navigation Device (reached via the WireGuard tunnel).
    ip_address: "192.168.2.203"
    # TCP port on the device. Must be a BIDIRECTIONAL ANPP port, because this
    # driver writes a Packet Timer + Packet Periods request to the device on
    # startup (deviceSetup()). 16718 is the main ANPP port and accepts these
    # writes; the driver then configures 020 System State + 028 Raw Sensors.
    # NOTE: do NOT use 16719 -- it is a read-only "This Device" output stream,
    # and the Subsonus resets the connection ("Connection reset by peer") the
    # moment the driver's startup config write hits it.
    port: 16718

    # This is the minimum period for reading and publishing data.
    # Warning on some systems this is performance limited.
    # The configuration will be rejected if publish_us < read_us
    # Units are in μs. 20000 = 50Hz | 1000 = 1000Hz etc.
    publish_us: 20000
    read_us: 1000

    # ANPP packets to request from the device.
    # Format: [id, period, id, period, ...] (must be an even number of entries)
    # Freq = 1000000 / (period * packet_timer_period)
    # With packet_timer_period = 1000 us:  Freq = 1000 / period
    #   50 Hz -> period 20   |   1 Hz -> period 1000
    #
    # This driver only decodes packets 020 (System State) and 028 (Raw Sensors)
    # into ROS topics, so only those are requested below.
    #   020 System State @ 50Hz  | 028 Raw Sensors @ 50Hz
    #
    # NOT SUPPORTED by this driver (would log "Unsupported packet definition
    # for ROS driver" warnings, no ROS topics) -- do not add unless you also
    # add decoders in adnav_driver.cpp:
    #   023 Status | 042 Angular Velocity | 043 Angular Acceleration
    # (Note: 020 already carries angular velocity, making 042 redundant anyway.)
    packet_request: [20, 20, 28, 20]

    # The size of the packet period in Microseconds.
    # Bounded to [1000-65535] [1000Hz-15.29Hz]
    packet_timer_period: 1000

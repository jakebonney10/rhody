/**:
  ros__parameters:
    # --- Connection Parameters ---
    connection_type: 'tcp'

    # --- TCP Connection Settings ---
    tcp_ip: '192.168.2.201'
    tcp_password: 'nortek'

    # --- Serial Connection Settings (unused) ---
    serial_port: '/dev/ttyUSB0'

    # --- Frame ID ---
    frame_id: 'nucleus_dvl'
    world_frame_id: 'world'

    # --- Automatic Control ---
    auto_connect: true
    auto_start: true

    # --- Reconnection ---
    # Retry forever, and re-send sensor_configs + restart measurement on every
    # reconnect, since a power-cycled device has lost them.
    reconnect_interval_s: 2.0
    tcp_keepalive_idle_s: 5

    # Enabled here, unlike the listen-only config: this node starts measurement
    # itself, so a silence this long means the link is dead rather than idle.
    data_timeout_s: 5.0

    # --- Sensor Configuration Commands ---
    sensor_configs:
      # IMU
      - 'SETIMU,DS="ON"'
      # AHRS
      - 'SETAHRS,FREQ=1,MODE=0,DS="ON"'
      # Nav
      - 'SETNAV,DS="ON"'
      # Bottom Track
      - 'SETBT,MODE="FAST_ACQ",WT="ON",PLMODE="MAX"'
      # Altimeter
      - 'SETALTI,PL=0'
      # Mission
      - 'SETMISSION,RANGE=25,SV=0'
      # Trigger and Frequency
      - 'SETTRIG,SRC="INTERNAL",FREQ=5,ALTI=5,CP=0'

    # Fluid Density
    fluid_density: 1000.0

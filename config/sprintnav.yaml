/**:
  ros__parameters:
    # Sonardyne SPRINT-Nav Mini on Rhody. The device is configured via its
    # web UI (http://192.168.2.206): create an output port and assign the
    # HNAV telegram to it. This driver only listens.
    transport: 'tcp'
    ip: '192.168.2.206'
    port: 4001                  # TODO: confirm the output port set on the web UI
    reconnect_interval_s: 2.0

    data_timeout_s: 2.0

    roll_pitch_stddev_deg: 0.05
    angular_rate_stddev_dps: 0.1
    depth_stddev_m: 0.1

    # Topic names are relative to the node namespace (rhody/nav/sensors), so
    # 'sprintnav/<topic>' resolves to /rhody/nav/sensors/sprintnav/<topic>.
    topics:
      status: 'sprintnav/status'
      imu: 'sprintnav/imu'
      navsatfix: 'sprintnav/navsatfix'
      velocity: 'sprintnav/velocity'
      depth: 'sprintnav/depth'
      altitude: 'sprintnav/altitude'
      dvl: 'sprintnav/dvl'
      temperature: 'sprintnav/temperature'
      sound_speed: 'sprintnav/sound_speed'
      time_reference: 'sprintnav/time_reference'

    frames:
      sensor: 'sprintnav_link'
      depth: 'utm_local'        # matches ekf_global odom/world frame
